name: EVOLVE API Tests

on:
  push:
    branches:
      - feat/evolve-voice-agent-20260929
  pull_request:

jobs:
  evolve-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_evolve_voice.py tests/test_evolve_android_workflow.py
